<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary Meta Tags -->
    <title>RefractLabs — We Bend Ideas Into Reality</title>
    <meta name="description" content="RefractLabs — Premium Web Development, UI/UX Design & Digital Identity Agency. We bend ideas into reality with cutting-edge technology." />
    <meta name="keywords" content="web development, UI UX design, digital agency, React, Next.js, branding, software development, RefractLabs" />
    <meta name="author" content="RefractLabs" />
    <meta name="theme-color" content="#c75b2a" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://refractlabs.com/" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://refractlabs.com/" />
    <meta property="og:title" content="RefractLabs — We Bend Ideas Into Reality" />
    <meta property="og:description" content="Premium Web Development, UI/UX Design & Digital Identity Agency. We bend ideas into reality." />
    <meta property="og:image" content="https://refractlabs.com/og-image.png" />
    <meta property="og:site_name" content="RefractLabs" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://refractlabs.com/" />
    <meta name="twitter:title" content="RefractLabs — We Bend Ideas Into Reality" />
    <meta name="twitter:description" content="Premium Web Development, UI/UX Design & Digital Identity Agency." />
    <meta name="twitter:image" content="https://refractlabs.com/og-image.png" />

    <!-- Structured Data - Organization -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "RefractLabs",
      "url": "https://refractlabs.com",
      "logo": "https://refractlabs.com/vite.svg",
      "description": "Premium Web Development, UI/UX Design & Digital Identity Agency",
      "email": "hello.refractlabs@gmail.com",
      "contactPoint": {
        "@type": "ContactPoint",
        "telephone": "+91-98765-43210",
        "contactType": "customer service",
        "email": "project@refractlabs.com"
      },
      "sameAs": [],
      "foundingDate": "2024",
      "address": {
        "@type": "PostalAddress",
        "streetAddress": "4545 La Jolla Village Dr",
        "addressLocality": "San Diego",
        "addressRegion": "CA",
        "postalCode": "92122",
        "addressCountry": "US"
      }
    }
    </script>

    <!-- Structured Data - WebSite (for Google Sitelinks Search Box) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "RefractLabs",
      "url": "https://refractlabs.com",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://refractlabs.com/?q={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
